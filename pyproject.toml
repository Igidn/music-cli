[project]
name = "music-cli"
version = "0.1.0"
description = "Ad-free YouTube Music player for the terminal"
readme = "README.md"
authors = [
    { name = "Igidn", email = "pongkhun553@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mpv>=1.0.8",
    "requests>=2.32",
    "textual>=8.2.8",
    "yt-dlp>=2026.7.4",
    "ytmusicapi>=1.12.2",
]

[project.scripts]
music-cli = "music_cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
markers = [
    "e2e: hits the live YouTube Music API",
]
