[project]
name = "music-cli"
version = "0.1.0"
description = "Ad-free YouTube Music player for the terminal"
readme = "README.md"
authors = [
    { name = "Igidn", email = "pongkhun553@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.50",
    "pygobject>=3.50; sys_platform != 'darwin'",
    "pyobjc-framework-avfoundation>=12.2.2; sys_platform == 'darwin'",
    "requests>=2.32",
    "textual>=8.2.8",
    "yt-dlp>=2026.7.4",
    "ytmusicapi>=1.12.2",
]

[project.scripts]
music-cli = "music_cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not e2e'"
markers = [
    "e2e: hits the live YouTube Music API",
]
